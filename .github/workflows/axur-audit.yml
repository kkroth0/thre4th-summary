name: Axur import audit
on:
  workflow_dispatch:
    inputs:
      login:
        description: GitHub login of the account to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vps-production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ACCOUNT_LOGIN: ${{ inputs.login }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify persisted IOC and insight correlations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_LOGIN" =~ ^[a-zA-Z0-9-]{1,39}$ ]]
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "timeout 90 node --input-type=module - '$VPS_APP_DIR' '$ACCOUNT_LOGIN'" < server/axurAudit.js
