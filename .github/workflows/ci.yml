name: CI

# Portão de build do site (frontend Vite/TS). O build precisa passar em todo push
# e PR. O lint roda como informativo (continue-on-error) porque há dívida de lint
# pré-existente — quando estiver zerada, troque para bloquear (remova a linha).
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (informativo)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
