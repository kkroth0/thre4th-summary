name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to deploy. Defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: read
  actions: read # download the dist artifact from the triggering CI run

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish backend bundle to VPS
    runs-on: ubuntu-latest
    environment: vps-production
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && vars.VPS_HOST != '' && vars.VPS_USER != '' && vars.VPS_APP_DIR != '' && vars.VPS_SERVICE != '' }}
    env:
      RELEASE_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_SERVICE: ${{ vars.VPS_SERVICE }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # Reuse the frontend built and validated by CI; fall back to a fresh build
      # for manual dispatch or if the artifact is unavailable.
      - name: Download built frontend from CI
        id: fetch_dist
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend (fallback)
        if: ${{ steps.fetch_dist.outcome != 'success' }}
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret VPS_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "::error::Missing secret VPS_KNOWN_HOSTS. Add the host key with: ssh-keyscan -p <port> <host>"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      # Snapshot the current code (not data/deps) before we overwrite anything,
      # so a bad deploy can be rolled back. Excludes match the sync step so
      # rollback only reverts source files — never the app's live JSON stores,
      # .env or node_modules.
      - name: Snapshot current release
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          ssh -p "${VPS_PORT}" "${target}" "VPS_APP_DIR='${VPS_APP_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          APP="${VPS_APP_DIR}"
          EX=(--exclude=node_modules/ --exclude=node_modules.bak/ --exclude=.env --exclude='.env.*' --exclude=.users.json --exclude=.posts.json --exclude=.daily-summaries.json --exclude=.scans.json --exclude=.allowlist.json --exclude=.feed-jobs.json --exclude=.feed-sources.json --exclude='*.bak.*')
          rm -rf "$APP/server.prev" "$APP/dist.prev"
          if [ -d "$APP/server" ]; then rsync -a --delete "${EX[@]}" "$APP/server/" "$APP/server.prev/"; fi
          if [ -d "$APP/dist" ]; then rsync -a --delete "$APP/dist/" "$APP/dist.prev/"; fi
          echo "snapshot ready"
          REMOTE

      # Flat layout: sync straight into the live app dir. `dist` is fully
      # generated so it's mirrored with --delete; `server` is synced WITHOUT
      # --delete and with excludes so runtime state (.env, node_modules and the
      # JSON stores written by the app) is preserved across deploys.
      - name: Sync bundle to VPS
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          ssh -p "${VPS_PORT}" "${target}" "mkdir -p '${VPS_APP_DIR}/dist' '${VPS_APP_DIR}/server' '${VPS_APP_DIR}/src/config'"

          rsync -az --delete -e "ssh -p ${VPS_PORT}" \
            ./dist/ "${target}:${VPS_APP_DIR}/dist/"

          rsync -az -e "ssh -p ${VPS_PORT}" \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.users.json' \
            --exclude='.posts.json' \
            --exclude='.daily-summaries.json' \
            --exclude='.scans.json' \
            --exclude='.allowlist.json' \
            --exclude='.feed-jobs.json' \
            --exclude='.feed-sources.json' \
            --exclude='*.bak.*' \
            ./server/ "${target}:${VPS_APP_DIR}/server/"

          rsync -az --delete -e "ssh -p ${VPS_PORT}" \
            ./src/config/ "${target}:${VPS_APP_DIR}/src/config/"

      # Install prod deps (with an instant, same-fs node_modules backup so a
      # failed install is recoverable), restart, then healthcheck a JSON API
      # route. Any failure auto-rolls-back code + deps and re-restarts, so a bad
      # push can never leave the service down.
      - name: Install, restart and healthcheck (auto-rollback)
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          ssh -p "${VPS_PORT}" "${target}" \
            "VPS_APP_DIR='${VPS_APP_DIR}' VPS_SERVICE='${VPS_SERVICE}' bash -s" <<'REMOTE'
          set -uo pipefail
          APP="${VPS_APP_DIR}"; SVC="${VPS_SERVICE}"
          EX=(--exclude=node_modules/ --exclude=node_modules.bak/ --exclude=.env --exclude='.env.*' --exclude=.users.json --exclude=.posts.json --exclude=.daily-summaries.json --exclude=.scans.json --exclude=.allowlist.json --exclude=.feed-jobs.json --exclude=.feed-sources.json --exclude='*.bak.*')

          rollback() {
            echo "::error::deploy failed — rolling back to previous release"
            [ -d "$APP/server.prev" ] && rsync -a --delete "${EX[@]}" "$APP/server.prev/" "$APP/server/"
            [ -d "$APP/dist.prev" ] && rsync -a --delete "$APP/dist.prev/" "$APP/dist/"
            if [ -d "$APP/server/node_modules.bak" ]; then
              rm -rf "$APP/server/node_modules"; mv "$APP/server/node_modules.bak" "$APP/server/node_modules"
            fi
            sudo systemctl restart "$SVC" || true
            exit 1
          }

          cd "$APP/server"
          # instant deps backup (same-fs rename); npm ci wipes node_modules, so keep the old set safe
          if [ -d node_modules ]; then rm -rf node_modules.bak; mv node_modules node_modules.bak; fi
          if ! npm ci --omit=dev; then
            rm -rf node_modules; [ -d node_modules.bak ] && mv node_modules.bak node_modules
            rollback
          fi

          sudo systemctl restart "$SVC"
          sleep 3

          ok=0
          for i in $(seq 1 6); do
            if curl -fsS --max-time 5 http://localhost:3001/api/vendors/status >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || rollback

          rm -rf node_modules.bak "$APP/server.prev" "$APP/dist.prev"
          sudo systemctl --no-pager --lines=15 status "$SVC" || true
          echo "deploy OK"
          REMOTE

      - name: Healthcheck
        if: ${{ vars.VPS_HEALTHCHECK_URL != '' }}
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${VPS_HEALTHCHECK_URL}" >/dev/null
