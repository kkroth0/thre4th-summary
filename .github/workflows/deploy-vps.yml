name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to deploy. Defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: read
  actions: read # download the dist artifact from the triggering CI run

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish backend bundle to VPS
    runs-on: ubuntu-latest
    environment: vps-production
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && vars.VPS_HOST != '' && vars.VPS_USER != '' && vars.VPS_APP_DIR != '' && vars.VPS_SERVICE != '' }}
    env:
      RELEASE_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_SERVICE: ${{ vars.VPS_SERVICE }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Reuse the frontend built and validated by CI; fall back to a fresh build
      # for manual dispatch or if the artifact is unavailable.
      - name: Download built frontend from CI
        id: fetch_dist
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend (fallback)
        if: ${{ steps.fetch_dist.outcome != 'success' }}
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret VPS_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "::error::Missing secret VPS_KNOWN_HOSTS. Add the host key with: ssh-keyscan -p <port> <host>"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      # Flat layout: sync straight into the live app dir. `dist` is fully
      # generated so it's mirrored with --delete; `server` is synced WITHOUT
      # --delete and with excludes so runtime state (.env, node_modules and the
      # JSON stores written by the app) is preserved across deploys.
      - name: Sync bundle to VPS
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"
          ssh -p "${VPS_PORT}" "${target}" "mkdir -p '${VPS_APP_DIR}/dist' '${VPS_APP_DIR}/server' '${VPS_APP_DIR}/src/config'"

          rsync -az --delete -e "ssh -p ${VPS_PORT}" \
            ./dist/ "${target}:${VPS_APP_DIR}/dist/"

          rsync -az -e "ssh -p ${VPS_PORT}" \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.users.json' \
            --exclude='.posts.json' \
            --exclude='.scans.json' \
            --exclude='.allowlist.json' \
            --exclude='.feed-jobs.json' \
            --exclude='.feed-sources.json' \
            --exclude='*.bak.*' \
            ./server/ "${target}:${VPS_APP_DIR}/server/"

          rsync -az --delete -e "ssh -p ${VPS_PORT}" \
            ./src/config/ "${target}:${VPS_APP_DIR}/src/config/"

      - name: Install deps and restart service
        shell: bash
        run: |
          set -euo pipefail
          target="${VPS_USER}@${VPS_HOST}"

          ssh -p "${VPS_PORT}" "${target}" \
            "VPS_APP_DIR='${VPS_APP_DIR}' VPS_SERVICE='${VPS_SERVICE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${VPS_APP_DIR}/server"
          npm ci --omit=dev
          sudo systemctl restart "${VPS_SERVICE}"
          sleep 3
          sudo systemctl --no-pager --lines=20 status "${VPS_SERVICE}"
          curl -fsS --retry 5 --retry-delay 2 http://localhost:3001/ >/dev/null && echo "local healthcheck OK"
          REMOTE

      - name: Healthcheck
        if: ${{ vars.VPS_HEALTHCHECK_URL != '' }}
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${VPS_HEALTHCHECK_URL}" >/dev/null
